<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TURF</title>
  <meta name="theme-color" content="#07111c" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link rel="icon" type="image/png" sizes="32x32" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=8967" />
  <link rel="shortcut icon" type="image/png" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=8967" />
  <link rel="apple-touch-icon" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=8967" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root{color-scheme:dark}
    html,body{margin:0;width:100%;height:100%;background:#07111c;overflow:hidden}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef8ff}
    .shell{position:fixed;inset:0;background:#07111c}
    iframe{width:100%;height:100%;border:0;display:block;background:#07111c}
    #turfApp{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none}
    body.turf-authenticated #turfApp{opacity:1;pointer-events:auto}
    #turfAuthShell{position:fixed;inset:0;z-index:1000000;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 18%,rgba(40,116,166,.28),transparent 36%),linear-gradient(180deg,#07111c 0%,#0a1622 100%)}
    body.turf-authenticated #turfAuthShell{display:none}
    .auth-card{width:min(430px,calc(100vw - 34px));box-sizing:border-box;padding:32px 28px 26px;border:1px solid rgba(140,206,247,.20);border-radius:24px;background:rgba(10,24,37,.94);box-shadow:0 28px 90px rgba(0,0,0,.42);text-align:center}
    .auth-logo{width:82px;height:82px;border-radius:20px;display:block;margin:0 auto 17px;box-shadow:0 10px 34px rgba(48,146,205,.24)}
    .auth-title{margin:0;font-size:34px;line-height:1;font-weight:1000;letter-spacing:.05em}
    .auth-subtitle{margin:10px 0 24px;color:#a9c7db;font-size:14px;line-height:1.45}
    .auth-options{display:grid;gap:12px}
    #googleButton{min-height:44px;display:flex;justify-content:center;align-items:center}
    .auth-btn{width:100%;min-height:46px;border-radius:10px;border:1px solid rgba(148,203,237,.25);font:800 15px/1 inherit;cursor:pointer;transition:.15s ease;background:#10283a;color:#eef8ff}
    .auth-btn:hover{transform:translateY(-1px);border-color:rgba(148,203,237,.48);background:#15344b}
    .auth-btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
    .guest-btn{background:#0f2333}
    #authStatus{min-height:20px;margin-top:15px;font-size:12px;color:#a9c7db}
    #authStatus.error{color:#ff9f9f}
    .auth-note{margin:12px 0 0;color:#718da0;font-size:11px;line-height:1.45}
    #turfTrialsLayer{position:fixed;inset:0;z-index:999999;background:#07111c;display:none}
    #turfTrialsLayer.open{display:block}
    #turfTrialsFrame{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="shell"><iframe id="turfApp" title="TURF" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <main id="turfAuthShell" aria-label="Sign in to TURF">
    <section class="auth-card">
      <img class="auth-logo" src="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=8967" alt="TURF" />
      <h1 class="auth-title">TURF</h1>
      <p class="auth-subtitle">Choose how you want to continue.</p>
      <div class="auth-options">
        <div id="googleButton" aria-label="Continue with Google"></div>
        <button id="guestButton" class="auth-btn guest-btn" type="button">Continue as Guest</button>
      </div>
      <div id="authStatus" role="status" aria-live="polite"></div>
      <p class="auth-note">This proof uses the exact current TURF app. Only login is different.</p>
    </section>
  </main>
  <div id="turfTrialsLayer" aria-hidden="true"><iframe id="turfTrialsFrame" title="TURF Trials" allow="fullscreen; clipboard-read; clipboard-write"></iframe></div>

  <script src="/turf-static/js/turf-api.js?v=live-auth-1"></script>
  <script src="/turf-static/js/turf-config.js?v=live-auth-1"></script>
  <script src="/turf-static/js/turf-auth.js?v=live-auth-1"></script>
  <script>
  (function(){
    'use strict';
    var APP_SRC='https://script.google.com/macros/s/AKfycbyZztqggePyYXWVuxhn-m7qaIM5xtR2OW0SSrj-_csJ4EcjTsEtgz9aAUP3yIFcAOI3yQ/exec?turfv=89.50&bridge=8967';
    var app=document.getElementById('turfApp');
    var guestButton=document.getElementById('guestButton');
    var googleButton=document.getElementById('googleButton');
    var status=document.getElementById('authStatus');
    var layer=document.getElementById('turfTrialsLayer');
    var frame=document.getElementById('turfTrialsFrame');
    var activeProfile=null;
    var busy=false;
    var googleRendered=false;

    function setStatus(message,isError){status.textContent=message||'';status.classList.toggle('error',!!isError)}
    function norm(p){p=String(p||'/trials/');return p.indexOf('/trials/')===0?p:'/trials/'}
    function openTrials(p){var t=norm(p);if(frame.getAttribute('src')!==t)frame.setAttribute('src',t);layer.classList.add('open');layer.setAttribute('aria-hidden','false');document.title='TURF — Trials'}
    function closeTrials(){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');document.title='TURF';try{app.contentWindow.postMessage({type:'turf-go-home',version:'worker-live-1'},'*')}catch(e){}}
    function sendProfile(){if(!activeProfile||!app.contentWindow)return;try{app.contentWindow.postMessage({type:'turf-auth-worker-profile',profile:activeProfile,version:'worker-live-1'},'*')}catch(e){}}
    function armProfileDelivery(){[0,40,100,180,300,500,800,1200,2000,3500,5500,8000].forEach(function(ms){setTimeout(sendProfile,ms)})}
    function unlock(profile){activeProfile=profile||{};document.body.classList.add('turf-authenticated');setStatus('');sendProfile();armProfileDelivery()}

    async function chooseGuest(){if(busy)return;busy=true;guestButton.disabled=true;try{setStatus('Opening your guest account…');var p=await TurfAuth.guestSignIn();unlock(p)}catch(e){setStatus(e&&e.message||String(e),true);busy=false;guestButton.disabled=false}}
    async function onGoogleCredential(response){if(busy)return;var credential=response&&response.credential?String(response.credential):'';if(!credential){setStatus('Google sign-in did not return an account.',true);return}busy=true;guestButton.disabled=true;try{setStatus('Signing in with Google…');var p=await TurfAuth.googleSignIn(credential);unlock(p)}catch(e){setStatus(e&&e.message||String(e),true);busy=false;guestButton.disabled=false}}

    function renderGoogle(){if(googleRendered)return true;if(!(window.google&&google.accounts&&google.accounts.id))return false;try{google.accounts.id.initialize({client_id:TURF_STATIC_CONFIG.googleClientId,callback:onGoogleCredential,auto_select:false,cancel_on_tap_outside:true});google.accounts.id.renderButton(googleButton,{type:'standard',theme:'filled_black',size:'large',text:'continue_with',shape:'rectangular',logo_alignment:'left',width:360});googleRendered=true;return true}catch(e){setStatus('Google sign-in could not initialize.',true);return false}}

    window.addEventListener('message',function(e){var d=e&&e.data;if(typeof d==='string'){if(d==='turf-open-trials')openTrials('/trials/');if(d==='turf-close-trials')closeTrials();return}if(!d||typeof d!=='object')return;
      if(d.type==='turf-worker-profile-request'){sendProfile();return}
      if(d.type==='turf-open-trials')openTrials(d.path||'/trials/');
      if(d.type==='turf-close-trials')closeTrials();
      if(d.type==='turf-page-title'&&!layer.classList.contains('open'))document.title=String(d.title||'TURF').slice(0,80);
      if(d.type==='turf-favicon'&&d.title&&!layer.classList.contains('open'))document.title=String(d.title).slice(0,80);
    },true);

    app.addEventListener('load',function(){sendProfile();armProfileDelivery()});
    guestButton.addEventListener('click',chooseGuest);
    app.src=APP_SRC;
    var attempts=0,timer=setInterval(function(){attempts++;if(renderGoogle()||attempts>50)clearInterval(timer)},120);

    TurfAuth.resume().then(function(p){if(p){setStatus('Restoring your TURF account…');unlock(p)}}).catch(function(){/* invalid saved session simply shows chooser */});
  })();
  </script>
</body>
</html>
