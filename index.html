<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TURF</title>
  <meta name="theme-color" content="#07111c" />
  <link id="turfFavicon" rel="icon" type="image/png" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=8953" />
  <link rel="shortcut icon" type="image/png" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=8953" />
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111c;overflow:hidden}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{position:fixed;inset:0;background:#07111c}
    iframe{width:100%;height:100%;border:0;display:block;background:#07111c}
    .loading{position:absolute;inset:0;display:grid;place-items:center;color:#d9efff;background:#07111c;z-index:0;font-weight:900;letter-spacing:.12em}
    #turfApp{position:relative;z-index:1}
    #turfTrialsLayer{position:fixed;inset:0;z-index:999999;background:#07111c;display:none}
    #turfTrialsLayer.open{display:block}
    #turfTrialsFrame{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading">LOADING TURF…</div>
    <iframe id="turfApp" src="https://script.google.com/macros/s/AKfycbyZztqggePyYXWVuxhn-m7qaIM5xtR2OW0SSrj-_csJ4EcjTsEtgz9aAUP3yIFcAOI3yQ/exec?turfv=89.47" title="TURF" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <div id="turfTrialsLayer" aria-hidden="true">
    <iframe id="turfTrialsFrame" title="TURF Trials" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <script>
  (function(){
    'use strict';
    var EXACT_T='https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=8953';
    var app=document.getElementById('turfApp');
    var layer=document.getElementById('turfTrialsLayer');
    var frame=document.getElementById('turfTrialsFrame');

    function norm(p){p=String(p||'/trials/');return p.indexOf('/trials/')===0?p:'/trials/'}
    function openTrials(p){var t=norm(p);if(frame.getAttribute('src')!==t)frame.setAttribute('src',t);layer.classList.add('open');layer.setAttribute('aria-hidden','false');document.title='TURF — Trials'}
    function closeTrials(){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');document.title='TURF';try{app.contentWindow.postMessage({type:'turf-go-home',version:'8947'},'*')}catch(e){}}
    function setFavicon(){var links=document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"]');for(var i=0;i<links.length;i++){links[i].type='image/png';links[i].href=EXACT_T}if(!links.length){var f=document.createElement('link');f.rel='icon';f.type='image/png';f.href=EXACT_T;document.head.appendChild(f)}}

    window.addEventListener('message',function(e){
      var d=e&&e.data;
      if(typeof d==='string'){if(d==='turf-open-trials')openTrials('/trials/');if(d==='turf-close-trials')closeTrials();return}
      if(!d||typeof d!=='object')return;
      if(d.type==='turf-open-trials')openTrials(d.path||'/trials/');
      if(d.type==='turf-close-trials')closeTrials();
      if(d.type==='turf-page-title'&&!layer.classList.contains('open'))document.title=String(d.title||'TURF').slice(0,80);
      if(d.type==='turf-favicon'){setFavicon();if(d.title&&!layer.classList.contains('open'))document.title=String(d.title).slice(0,80)}
    });

    app.addEventListener('load',function(){var l=document.querySelector('.loading');if(l)l.style.display='none'});
    setFavicon();
  })();
  </script>
</body>
</html>
