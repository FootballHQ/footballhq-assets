<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TURF</title>
  <meta name="theme-color" content="#07111c" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link id="turfFavicon" rel="icon" type="image/png" sizes="32x32" href="/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-16" />
  <link rel="shortcut icon" type="image/png" href="/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-16" />
  <link rel="apple-touch-icon" href="/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-16" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/turf-static/js/turf-api.js?v=worker-auth-16"></script>
  <script src="/turf-static/js/turf-config.js?v=worker-auth-16"></script>
  <script src="/turf-static/js/turf-auth.js?v=worker-auth-16"></script>
  <style>
    :root{color-scheme:dark}
    html,body{margin:0;width:100%;height:100%;background:#07111c;overflow:hidden}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef8ff}
    .shell{position:fixed;inset:0;background:#07111c}
    iframe{width:100%;height:100%;border:0;display:block;background:#07111c}
    #turfApp{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none}
    body.turf-authenticated #turfApp{opacity:1;pointer-events:auto}
    #turfAuthShell{position:fixed;inset:0;z-index:1000000;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 18%,rgba(40,116,166,.28),transparent 36%),linear-gradient(180deg,#07111c 0%,#0a1622 100%)}
    body.turf-authenticated #turfAuthShell{display:none}
    .auth-card{width:min(430px,calc(100vw - 34px));box-sizing:border-box;padding:32px 28px 26px;border:1px solid rgba(140,206,247,.20);border-radius:24px;background:rgba(10,24,37,.94);box-shadow:0 28px 90px rgba(0,0,0,.42);text-align:center}
    .auth-logo{width:82px;height:82px;border-radius:20px;display:block;margin:0 auto 17px;box-shadow:0 10px 34px rgba(48,146,205,.24);object-fit:contain}
    .auth-title{margin:0;font-size:34px;line-height:1;font-weight:1000;letter-spacing:.05em}
    .auth-subtitle{margin:10px 0 24px;color:#a9c7db;font-size:14px;line-height:1.45}
    .auth-options{display:grid;gap:12px}
    #googleButton{min-height:44px;display:flex;justify-content:center;align-items:center}
    .auth-btn{width:100%;min-height:46px;border-radius:10px;border:1px solid rgba(148,203,237,.25);font:800 15px/1 inherit;cursor:pointer;transition:.15s ease;background:#10283a;color:#eef8ff}
    .auth-btn:hover{transform:translateY(-1px);border-color:rgba(148,203,237,.48);background:#15344b}
    .auth-btn:disabled{opacity:.48;cursor:not-allowed;transform:none}
    .guest-btn{background:#0f2333}.apple-btn{background:#111;color:#fff;border-color:#2d3942}.coming{display:inline-block;margin-left:8px;padding:2px 6px;border-radius:999px;font-size:9px;letter-spacing:.08em;background:#24313b;color:#aebbc4;vertical-align:1px}
    #authStatus{min-height:20px;margin-top:15px;font-size:12px;color:#a9c7db}#authStatus.error{color:#ff9f9f}.auth-note{margin:12px 0 0;color:#718da0;font-size:11px;line-height:1.45}
    #turfTrialsLayer{position:fixed;inset:0;z-index:999999;background:#07111c;display:none}#turfTrialsLayer.open{display:block}#turfTrialsFrame{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="shell"><iframe id="turfApp" title="TURF" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe></div>
  <main id="turfAuthShell" aria-label="Sign in to TURF"><section class="auth-card">
    <img class="auth-logo" src="/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-16" alt="TURF" />
    <h1 class="auth-title">TURF</h1><p class="auth-subtitle">Choose how you want to continue.</p>
    <div class="auth-options"><div id="googleButton" aria-label="Continue with Google"></div><button id="guestButton" class="auth-btn guest-btn" type="button">Continue as Guest</button><button class="auth-btn apple-btn" type="button" disabled>Continue with Apple <span class="coming">COMING SOON</span></button></div>
    <div id="authStatus" role="status" aria-live="polite"></div><p class="auth-note">Your sign-in choice determines which TURF account is loaded.</p>
  </section></main>
  <div id="turfTrialsLayer" aria-hidden="true"><iframe id="turfTrialsFrame" title="TURF Trials" allow="fullscreen; clipboard-read; clipboard-write"></iframe></div>
  <script>
  (function(){
    'use strict';
    var GOOGLE_CLIENT_ID='981412579361-ebftqmubklnd2pk5k88s8kcbh27cj7i8.apps.googleusercontent.com';
    var APP_SRC='https://script.google.com/macros/s/AKfycbyZztqggePyYXWVuxhn-m7qaIM5xtR2OW0SSrj-_csJ4EcjTsEtgz9aAUP3yIFcAOI3yQ/exec?turfv=89.62&bridge=worker-auth-16';
    var EXACT_T='/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-16';
    var app=document.getElementById('turfApp'),guestButton=document.getElementById('guestButton'),googleButton=document.getElementById('googleButton'),status=document.getElementById('authStatus'),layer=document.getElementById('turfTrialsLayer'),frame=document.getElementById('turfTrialsFrame');
    var authStarted=false,googleRendered=false,pendingProfile=null,appStarted=false,appRevealed=false,lastGoogleReset=0,appReceiverReady=false,readyTimer=null;

    function setStatus(message,isError){status.textContent=message||'';status.classList.toggle('error',!!isError)}
    function norm(p){p=String(p||'/trials/');return p.indexOf('/trials/')===0?p:'/trials/'}
    function openTrials(p){var t=norm(p);if(frame.getAttribute('src')!==t)frame.setAttribute('src',t);layer.classList.add('open');layer.setAttribute('aria-hidden','false');document.title='TURF — Trials'}
    function closeTrials(){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');document.title='TURF';try{app.contentWindow.postMessage({type:'turf-go-home',version:'worker-auth-16'},'*')}catch(e){}}
    function setFavicon(){document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"],link[rel="apple-touch-icon"]').forEach(function(x){x.href=EXACT_T})}
    function remember(profile){try{sessionStorage.setItem('turfStaticBootProfileV1',JSON.stringify(profile||{}));localStorage.setItem('turfAuthCachedProfileV1',JSON.stringify(profile||{}));if(profile&&profile.token)localStorage.setItem('turfAuthAccountTokenV1',profile.token)}catch(e){}window.__TURF_AUTH_PROFILE__=profile||{};window.__TURF_AUTH_TOKEN__=profile&&profile.token||''}
    function reveal(){if(appRevealed)return;appRevealed=true;if(readyTimer){clearTimeout(readyTimer);readyTimer=null}document.body.classList.add('turf-authenticated');setStatus('',false);authStarted=false;guestButton.disabled=false}
    function startApp(){if(appStarted)return;appStarted=true;app.src=APP_SRC+'&ts='+Date.now()}
    function pushProfile(){if(!pendingProfile||!app.contentWindow||!appStarted)return;try{app.contentWindow.postMessage({type:'turf-auth-worker-profile',profile:pendingProfile,token:pendingProfile.token,version:'worker-auth-16'},'*')}catch(e){}}
    function schedulePushes(){[0,100,250,500,900,1500,2500,4000,6500,9000].forEach(function(ms){setTimeout(pushProfile,ms)})}
    function armAppReadyTimeout(){if(readyTimer)clearTimeout(readyTimer);readyTimer=setTimeout(function(){if(appRevealed)return;setStatus('Your TURF account signed in, but TURF did not confirm the account. Refresh once and try again.',true);authStarted=false;guestButton.disabled=false},15000)}
    function finish(profile){
      if(!profile||!profile.token)throw new Error('No TURF profile returned.');
      remember(profile);pendingProfile=profile;setStatus('Signed in. Opening TURF…',false);startApp();pushProfile();schedulePushes();armAppReadyTimeout();
    }
    function acknowledge(){pendingProfile=null;reveal()}
    async function chooseGuest(){if(authStarted)return;authStarted=true;guestButton.disabled=true;try{setStatus('Opening guest account…',false);var p=await TurfAuth.guestSignIn();finish(p)}catch(e){authStarted=false;guestButton.disabled=false;setStatus(e&&e.message||String(e),true)}}
    async function onGoogleCredential(response){if(authStarted)return;var credential=response&&response.credential?String(response.credential):'';if(!credential){setStatus('Google sign-in did not return an account. Please try again.',true);return}authStarted=true;guestButton.disabled=true;try{setStatus('Signing in with Google…',false);var p=await TurfAuth.googleSignIn(credential);finish(p)}catch(e){authStarted=false;guestButton.disabled=false;setStatus(e&&e.message||String(e),true);setTimeout(resetGoogle,250)}}
    function renderGoogle(){
      if(googleRendered)return true;if(!(window.google&&google.accounts&&google.accounts.id))return false;
      try{google.accounts.id.initialize({client_id:GOOGLE_CLIENT_ID,callback:onGoogleCredential,auto_select:false,cancel_on_tap_outside:true,ux_mode:'popup',itp_support:true,use_fedcm_for_button:false});googleButton.innerHTML='';google.accounts.id.renderButton(googleButton,{type:'standard',theme:'outline',size:'large',text:'signin_with',shape:'rectangular',logo_alignment:'left',width:360});googleRendered=true;return true}catch(e){setStatus('Google sign-in could not initialize. Please refresh and try again.',true);return false}
    }
    function resetGoogle(){if(appRevealed||authStarted)return;var now=Date.now();if(now-lastGoogleReset<500)return;lastGoogleReset=now;try{if(window.google&&google.accounts&&google.accounts.id)google.accounts.id.cancel()}catch(e){}googleRendered=false;googleButton.innerHTML='';renderGoogle()}
    function startGoogleRenderer(){if(appRevealed)return;var googleAttempts=0,googleTimer=setInterval(function(){googleAttempts++;if(renderGoogle()||googleAttempts>60)clearInterval(googleTimer)},125)}

    window.addEventListener('message',function(e){
      var d=e&&e.data;if(typeof d==='string'){if(d==='turf-open-trials')openTrials('/trials/');if(d==='turf-close-trials')closeTrials();return}if(!d||typeof d!=='object')return;
      if(e.source===app.contentWindow&&d.type==='turf-worker-profile-receiver-ready'){
        appReceiverReady=true;
        if(pendingProfile){pushProfile();schedulePushes()}
        return;
      }
      if(e.source===app.contentWindow&&d.type==='turf-auth-ready'){
        var expected=pendingProfile&&String(pendingProfile.token||'');
        var received=String(d.token||'');
        var workerVersion=d.version==='worker-profile-v2'||d.version==='8940-worker';
        if(!expected||!workerVersion||received!==expected)return;
        acknowledge();return;
      }
      if(d.type==='turf-open-trials')openTrials(d.path||'/trials/');if(d.type==='turf-close-trials')closeTrials();if(d.type==='turf-page-title'&&!layer.classList.contains('open'))document.title=String(d.title||'TURF').slice(0,80);if(d.type==='turf-favicon'){setFavicon();if(d.title&&!layer.classList.contains('open'))document.title=String(d.title).slice(0,80)}
    },true);

    app.onload=function(){if(pendingProfile){pushProfile();schedulePushes()}};
    guestButton.addEventListener('click',chooseGuest);
    window.addEventListener('focus',function(){if(!appRevealed)setTimeout(resetGoogle,300)});
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&!appRevealed)setTimeout(resetGoogle,350)});

    setFavicon();
    setStatus('',false);
    startGoogleRenderer();
  })();
  </script>
</body>
</html>
