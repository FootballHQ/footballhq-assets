<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TURF</title>
  <meta name="theme-color" content="#07111c" />
  <link id="turfFavicon" rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23071927'/%3E%3Cpath d='M15 15h38l-3 10H37L31 50H20l6-25H12z' fill='%23eaf7ff'/%3E%3Cpath d='M15 15h38l-1.2 4H16z' fill='%232bbcff'/%3E%3C/svg%3E" />
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111c;overflow:hidden}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{position:fixed;inset:0;background:#07111c}
    iframe{width:100%;height:100%;border:0;display:block;background:#07111c}
    .loading{position:absolute;inset:0;display:grid;place-items:center;color:#d9efff;background:#07111c;z-index:0;font-weight:900;letter-spacing:.12em}
    #turfApp{position:relative;z-index:1}
    #turfTrialsLayer{position:fixed;inset:0;z-index:999999;background:#07111c;display:none}
    #turfTrialsLayer.open{display:block}
    #turfTrialsFrame{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading">LOADING TURF…</div>
    <iframe id="turfApp" src="https://script.google.com/macros/s/AKfycbyZztqggePyYXWVuxhn-m7qaIM5xtR2OW0SSrj-_csJ4EcjTsEtgz9aAUP3yIFcAOI3yQ/exec" title="TURF" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>
  <div id="turfTrialsLayer" aria-hidden="true">
    <iframe id="turfTrialsFrame" title="TURF Trials" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <script>
  (function(){
    'use strict';
    var layer=document.getElementById('turfTrialsLayer'),frame=document.getElementById('turfTrialsFrame'),app=document.getElementById('turfApp');
    function norm(p){p=String(p||'/trials/');return p.indexOf('/trials/')===0?p:'/trials/'}
    function openTrials(p){var t=norm(p);if(frame.getAttribute('src')!==t)frame.setAttribute('src',t);layer.classList.add('open');layer.setAttribute('aria-hidden','false');document.title='TURF — Trials'}
    function closeTrials(){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');document.title='TURF';try{app.contentWindow.postMessage({type:'turf-go-home',version:'8904'},'*')}catch(e){}}
    function setFavicon(href){if(!href)return;var f=document.getElementById('turfFavicon');if(!f){f=document.createElement('link');f.id='turfFavicon';f.rel='icon';document.head.appendChild(f)}f.href=href}
    window.addEventListener('message',function(e){var d=e&&e.data;if(typeof d==='string'){if(d==='turf-open-trials')openTrials('/trials/');if(d==='turf-close-trials')closeTrials();return}if(!d||typeof d!=='object')return;if(d.type==='turf-open-trials')openTrials(d.path||'/trials/');if(d.type==='turf-close-trials')closeTrials();if(d.type==='turf-page-title'&&!layer.classList.contains('open'))document.title=String(d.title||'TURF').slice(0,80);if(d.type==='turf-favicon'){setFavicon(d.href);if(d.title&&!layer.classList.contains('open'))document.title=String(d.title).slice(0,80)}});
    try{var p=new URLSearchParams(location.search);if(p.get('trials')==='1')openTrials('/trials/')}catch(e){}
  })();
  </script>

<!-- ============================================================
 TURF BATCH 1B — TOP-LEVEL AUTH WRAPPER
 GitHub: FootballHQ/footballhq-assets/index.html

 PASTE THIS ENTIRE BLOCK IMMEDIATELY BEFORE </body>
 in the ROOT GitHub index.html that serves turftrials.com.

 This moves Google Sign-In to https://turftrials.com itself,
 avoiding the Apps Script googleusercontent.com origin mismatch.
 ============================================================ -->

<script src="https://accounts.google.com/gsi/client" async defer></script>

<style id="turf-wrapper-auth-css">
  #turfWrapperAuth{
    position:fixed;inset:0;z-index:2147483647;
    display:flex;align-items:center;justify-content:center;
    padding:28px;
    background:
      radial-gradient(circle at 50% 18%,rgba(13,147,213,.18),transparent 35%),
      radial-gradient(circle at 50% 100%,rgba(0,179,126,.11),transparent 42%),
      linear-gradient(145deg,#03101a 0%,#051927 50%,#020b12 100%);
    color:#fff;
    font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  }
  #turfWrapperAuth.hidden{display:none!important}
  .twa-card{
    width:min(460px,100%);
    border:1px solid rgba(62,190,246,.38);
    border-radius:24px;
    padding:34px 32px 28px;
    background:linear-gradient(155deg,rgba(9,35,52,.98),rgba(3,19,30,.99));
    box-shadow:0 28px 90px rgba(0,0,0,.55),0 0 46px rgba(31,176,240,.08);
  }
  .twa-logo{
    width:78px;height:78px;margin:0 auto 16px;border-radius:21px;
    display:grid;place-items:center;
    background:linear-gradient(145deg,#0e2940,#061522);
    border:1px solid rgba(73,194,247,.32);
    box-shadow:0 10px 28px rgba(0,0,0,.35);
    font-size:44px;font-weight:1000;font-style:italic;color:#eefaff;
    text-shadow:0 0 15px #26b6ff;
  }
  .twa-title{margin:0;text-align:center;font-size:34px;line-height:1;font-weight:1000;letter-spacing:.04em}
  .twa-tag{margin:9px 0 28px;text-align:center;color:#77dcff;font-size:10px;font-weight:900;letter-spacing:.27em}
  .twa-copy{text-align:center;color:#a9bdca;font-size:13px;line-height:1.55;margin:0 auto 24px;max-width:350px}
  #turfWrapperGoogleButton{min-height:44px;display:flex;justify-content:center;align-items:center;margin-bottom:11px}
  .twa-btn{
    width:100%;min-height:48px;border-radius:13px;
    border:1px solid rgba(121,176,207,.31);
    font-size:14px;font-weight:900;cursor:pointer;transition:.16s ease;
  }
  .twa-btn:hover{transform:translateY(-1px);border-color:#31bdf4}
  .twa-btn.apple{background:#0a0f14;color:#fff}
  .twa-btn.guest{background:transparent;color:#b9ccd8}
  .twa-btn:disabled{opacity:.55;cursor:default;transform:none}
  .twa-divider{display:flex;align-items:center;gap:12px;margin:15px 0;color:#638195;font-size:10px;font-weight:900;letter-spacing:.14em}
  .twa-divider:before,.twa-divider:after{content:"";height:1px;background:rgba(119,169,198,.17);flex:1}
  #turfWrapperAuthStatus{min-height:18px;margin-top:14px;text-align:center;font-size:12px;font-weight:800;color:#83dfff}
  #turfWrapperAuthStatus.error{color:#ff8585}
  .twa-foot{margin-top:17px;text-align:center;color:#607b8c;font-size:10px;line-height:1.45}
  @media(max-width:520px){
    #turfWrapperAuth{padding:16px}
    .twa-card{padding:28px 20px 23px;border-radius:20px}
  }
</style>

<div id="turfWrapperAuth">
  <div class="twa-card">
    <div class="twa-logo">T</div>
    <h1 class="twa-title">TURF</h1>
    <div class="twa-tag">COMPETE • COLLECT • CLIMB</div>

    <p class="twa-copy">
      Sign in to keep your cards, coins, rankings, streaks and rewards tied to one TURF account.
    </p>

    <div id="turfWrapperGoogleButton"></div>

    <button id="turfWrapperApple" class="twa-btn apple" type="button">
      Continue with Apple
    </button>

    <div class="twa-divider">OR</div>

    <button id="turfWrapperGuest" class="twa-btn guest" type="button">
      Continue as Guest
    </button>

    <div id="turfWrapperAuthStatus"></div>

    <div class="twa-foot">
      Google will let you choose another signed-in account or use another account.
      Guest progress stays on this browser until you connect a sign-in method.
    </div>
  </div>
</div>

<script id="turf-wrapper-auth-js">
(function(){
  'use strict';
  if(window.__TURF_WRAPPER_AUTH__) return;
  window.__TURF_WRAPPER_AUTH__=true;

  var CLIENT_ID='981412579361-ebftqmubklnd2pk5k88s8kcbh27cj7i8.apps.googleusercontent.com';
  var SESSION_KEY='turfAuthAccountTokenV1';
  var GUEST_KEY='turfStableGuestTokenV1';

  var app=document.getElementById('turfApp');
  var gate=document.getElementById('turfWrapperAuth');
  var status=document.getElementById('turfWrapperAuthStatus');
  var guestBtn=document.getElementById('turfWrapperGuest');
  var appleBtn=document.getElementById('turfWrapperApple');

  function setStatus(msg,isError){
    status.textContent=msg||'';
    status.classList.toggle('error',!!isError);
  }

  function savedToken(){
    try{return String(localStorage.getItem(SESSION_KEY)||'').trim()}catch(e){return ''}
  }

  function saveToken(token){
    token=String(token||'').trim();
    if(!token)return;
    try{localStorage.setItem(SESSION_KEY,token)}catch(e){}
  }

  function clearToken(){
    try{localStorage.removeItem(SESSION_KEY)}catch(e){}
  }

  function showGate(message,isError){
    gate.classList.remove('hidden');
    if(message!==undefined)setStatus(message,isError);
  }

  function hideGate(){
    gate.classList.add('hidden');
    setStatus('',false);
  }

  function sendToApp(message){
    if(!app||!app.contentWindow)return;
    app.contentWindow.postMessage(message,'*');
  }

  function makeGuestToken(){
    var token='';
    try{token=String(localStorage.getItem(GUEST_KEY)||'')}catch(e){}
    if(token)return token;
    token='fhq-guest-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,12);
    try{localStorage.setItem(GUEST_KEY,token)}catch(e){}
    return token;
  }

  function googleCredential(response){
    if(!response||!response.credential){
      setStatus('Google sign-in did not return a credential.',true);
      return;
    }
    setStatus('Signing in to TURF…',false);
    sendToApp({
      type:'turf-auth-google',
      credential:response.credential,
      version:'1B'
    });
  }

  function initGoogle(){
    if(!(window.google&&google.accounts&&google.accounts.id)){
      setTimeout(initGoogle,150);
      return;
    }

    try{google.accounts.id.disableAutoSelect()}catch(e){}

    google.accounts.id.initialize({
      client_id:CLIENT_ID,
      callback:googleCredential,
      auto_select:false,
      cancel_on_tap_outside:false,
      context:'signin'
    });

    google.accounts.id.renderButton(
      document.getElementById('turfWrapperGoogleButton'),
      {
        type:'standard',
        theme:'outline',
        size:'large',
        text:'continue_with',
        shape:'rectangular',
        width:360
      }
    );
  }

  guestBtn.addEventListener('click',function(){
    guestBtn.disabled=true;
    setStatus('Opening your guest account…',false);
    sendToApp({
      type:'turf-auth-guest',
      guestToken:makeGuestToken(),
      version:'1B'
    });
  });

  appleBtn.addEventListener('click',function(){
    setStatus('Apple sign-in is being connected next.',false);
  });

  window.addEventListener('message',function(e){
    if(!app||e.source!==app.contentWindow)return;
    var d=e&&e.data;
    if(!d||typeof d!=='object')return;

    if(d.type==='turf-auth-ready'){
      if(d.token)saveToken(d.token);
      guestBtn.disabled=false;
      hideGate();
      return;
    }

    if(d.type==='turf-auth-needs-link'){
      guestBtn.disabled=false;
      setStatus(d.message||'Google verified, but this Google account is not linked to a TURF profile yet.',true);
      return;
    }

    if(d.type==='turf-auth-error'){
      guestBtn.disabled=false;
      setStatus(d.message||'TURF sign-in failed.',true);
      return;
    }

    if(d.type==='turf-auth-resume-invalid'){
      clearToken();
      guestBtn.disabled=false;
      showGate('',false);
    }
  });

  function resume(){
    var token=savedToken();
    if(token){
      setStatus('Restoring your TURF account…',false);
      sendToApp({type:'turf-auth-resume',token:token,version:'1B'});
    }else{
      showGate('',false);
    }
  }

  if(app){
    app.addEventListener('load',function(){
      setTimeout(resume,300);
    });
  }

  showGate('Loading secure sign-in…',false);
  initGoogle();
})();
</script>

</body>
</html>
