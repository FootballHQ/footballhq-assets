<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TURF</title>
  <meta name="theme-color" content="#07111c" />
  <link rel="icon" type="image/svg+xml" href="/v88-36/brand/turf-mark.svg?v=8896" />
  <style>
    html,body{margin:0;width:100%;height:100%;background:#07111c;overflow:hidden}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .shell{position:fixed;inset:0;background:#07111c}
    iframe{width:100%;height:100%;border:0;display:block;background:#07111c}
    .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:14px;color:#d9efff;background:#07111c;z-index:0;font-weight:900;letter-spacing:.12em}
    .loading img{width:44px;height:44px;filter:drop-shadow(0 0 10px rgba(32,184,255,.3))}
    #turfApp{position:relative;z-index:1}
    #turfTrialsLayer{position:fixed;inset:0;z-index:999999;background:#07111c;display:none}
    #turfTrialsLayer.open{display:block}
    #turfTrialsFrame{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0}
  </style>
</head>
<body>
  <div class="shell">
    <div class="loading"><img src="/v88-36/brand/turf-mark.svg?v=8896" alt=""><span>LOADING TURF…</span></div>
    <iframe
      id="turfApp"
      src="https://script.google.com/macros/s/AKfycbyZztqggePyYXWVuxhn-m7qaIM5xtR2OW0SSrj-_csJ4EcjTsEtgz9aAUP3yIFcAOI3yQ/exec"
      title="TURF"
      allow="clipboard-read; clipboard-write; fullscreen"
      referrerpolicy="strict-origin-when-cross-origin">
    </iframe>
  </div>

  <div id="turfTrialsLayer" aria-hidden="true">
    <iframe id="turfTrialsFrame" title="TURF Trials" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>

  <script>
    (function(){
      'use strict';
      var layer=document.getElementById('turfTrialsLayer');
      var frame=document.getElementById('turfTrialsFrame');
      var app=document.getElementById('turfApp');

      function normalizeTrialsPath(path){
        var p=String(path||'/trials/');
        if(p.indexOf('/trials/')!==0) p='/trials/';
        return p;
      }

      function openTrials(path){
        var target=normalizeTrialsPath(path);
        if(frame.getAttribute('src')!==target) frame.setAttribute('src',target);
        layer.classList.add('open');
        layer.setAttribute('aria-hidden','false');
        document.title='TURF — Trials';
      }

      function closeTrialsToHome(){
        layer.classList.remove('open');
        layer.setAttribute('aria-hidden','true');
        document.title='TURF';
        try{
          if(app && app.contentWindow){
            app.contentWindow.postMessage({type:'turf-go-home',version:'8896'},'*');
          }
        }catch(e){}
      }

      window.addEventListener('message',function(e){
        var d=e&&e.data;
        if(typeof d==='string'){
          if(d==='turf-open-trials') openTrials('/trials/');
          if(d==='turf-close-trials') closeTrialsToHome();
          return;
        }
        if(!d||typeof d!=='object') return;
        if(d.type==='turf-open-trials'){
          openTrials(d.path||'/trials/');
          try{if(e.source)e.source.postMessage({type:'turf-trials-opened',version:'8896'},'*')}catch(_e){}
        }
        if(d.type==='turf-close-trials') closeTrialsToHome();
        if(d.type==='turf-page-title' && !layer.classList.contains('open')){
          document.title=String(d.title||'TURF').slice(0,80);
        }
      });

      try{
        var p=new URLSearchParams(location.search);
        if(p.get('trials')==='1') openTrials('/trials/');
      }catch(e){}
    })();
  </script>
</body>
</html>
