<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TURF</title>
  <meta name="theme-color" content="#07111c" />
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <link id="turfFavicon" rel="icon" type="image/png" sizes="32x32" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-42" />
  <link rel="shortcut icon" type="image/png" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-42" />
  <link rel="apple-touch-icon" href="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-42" />
  <script src="/turf-live-worker-parent.js?v=worker-auth-42"></script>
  <style>
    :root{color-scheme:dark}
    html,body{margin:0;width:100%;height:100%;background:#07111c;overflow:hidden}
    body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef8ff}
    .shell{position:fixed;inset:0;background:#07111c}
    iframe{width:100%;height:100%;border:0;display:block;background:#07111c}
    #turfApp{position:absolute;inset:0;z-index:1;opacity:0;pointer-events:none}
    body.turf-authenticated #turfApp{opacity:1;pointer-events:auto}
    #turfAuthShell{position:fixed;inset:0;z-index:1000000;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 18%,rgba(40,116,166,.24),transparent 36%),linear-gradient(180deg,#07111c 0%,#0a1622 100%)}
    body.turf-authenticated #turfAuthShell{display:none}
    .loading-card{width:min(330px,calc(100vw - 34px));box-sizing:border-box;padding:30px 26px 27px;border:1px solid rgba(140,206,247,.16);border-radius:22px;background:rgba(10,24,37,.88);box-shadow:0 28px 90px rgba(0,0,0,.36);text-align:center}
    .loading-logo{width:78px;height:78px;border-radius:19px;display:block;margin:0 auto 17px;box-shadow:0 10px 34px rgba(48,146,205,.22)}
    .loading-title{margin:0;font-size:32px;line-height:1;font-weight:1000;letter-spacing:.055em}
    #authStatus{min-height:20px;margin-top:14px;color:#9dbed1;font-size:13px;line-height:1.45}
    #authStatus.error{color:#ff9f9f}
    .pulse{width:32px;height:3px;margin:18px auto 0;border-radius:99px;background:#173448;overflow:hidden;position:relative}
    .pulse:after{content:"";position:absolute;inset:0;width:45%;border-radius:99px;background:#31c6ff;animation:load 1.05s ease-in-out infinite alternate}
    @keyframes load{from{transform:translateX(-20%)}to{transform:translateX(145%)}}
    #turfTrialsLayer{position:fixed;inset:0;z-index:999999;background:#07111c;display:none}
    #turfTrialsLayer.open{display:block}
    #turfTrialsFrame{position:absolute;inset:0;z-index:1;width:100%;height:100%;border:0}
  </style>
</head>
<body data-turf-build="worker-auth-42-browser-account">
  <div class="shell">
    <iframe id="turfApp" title="TURF" allow="clipboard-read; clipboard-write; fullscreen" referrerpolicy="strict-origin-when-cross-origin"></iframe>
  </div>

  <main id="turfAuthShell" aria-label="Loading TURF">
    <section class="loading-card">
      <img class="loading-logo" src="https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-42" alt="TURF" />
      <h1 class="loading-title">TURF</h1>
      <div id="authStatus" role="status" aria-live="polite">Loading your TURF account…</div>
      <div class="pulse" aria-hidden="true"></div>
    </section>
  </main>

  <div id="turfTrialsLayer" aria-hidden="true">
    <iframe id="turfTrialsFrame" title="TURF Trials" allow="fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>

  <script>
  (function(){
    'use strict';
    /* The iframe is the existing TURF application. This wrapper only handles account restoration. */
    var APP_SRC='https://turftest-api.turftrials.workers.dev/app?production=1&v=worker-auth-42';
    var EXACT_T='https://footballhq.github.io/footballhq-assets/v88-36/brand/turf-app-icon-v8953.png?v=worker-auth-42';
    var app=document.getElementById('turfApp');
    var layer=document.getElementById('turfTrialsLayer');
    var frame=document.getElementById('turfTrialsFrame');
    window.__TURF_EXISTING_APP_SRC__=APP_SRC;
    function norm(p){p=String(p||'/trials/');return p.indexOf('/trials/')===0?p:'/trials/'}
    function openTrials(p){var t=norm(p);if(frame.getAttribute('src')!==t)frame.setAttribute('src',t);layer.classList.add('open');layer.setAttribute('aria-hidden','false');document.title='TURF — Trials'}
    function closeTrials(){layer.classList.remove('open');layer.setAttribute('aria-hidden','true');document.title='TURF';try{app.contentWindow.postMessage({type:'turf-go-home',version:'worker-auth-42'},'https://turftest-api.turftrials.workers.dev')}catch(e){}}
    function setFavicon(){var links=document.querySelectorAll('link[rel="icon"],link[rel="shortcut icon"],link[rel="apple-touch-icon"]');for(var i=0;i<links.length;i++)links[i].href=EXACT_T}
    window.addEventListener('message',function(e){var d=e&&e.data;if(typeof d==='string'){if(d==='turf-open-trials')openTrials('/trials/');if(d==='turf-close-trials')closeTrials();return}if(!d||typeof d!=='object')return;if(d.type==='turf-open-trials')openTrials(d.path||'/trials/');if(d.type==='turf-close-trials')closeTrials();if(d.type==='turf-page-title'&&!layer.classList.contains('open'))document.title=String(d.title||'TURF').slice(0,80);if(d.type==='turf-favicon'){setFavicon();if(d.title&&!layer.classList.contains('open'))document.title=String(d.title).slice(0,80)}},true);
    setFavicon();
  })();
  </script>
</body>
</html>
