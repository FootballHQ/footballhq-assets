name: Cut Over TURF Login Without Rebuilding UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cutover-turf-login.yml'

permissions:
  contents: write

concurrency:
  group: turf-login-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker V2 source
        working-directory: turf-static/worker
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Check live Worker before deploying
        id: live_worker
        run: |
          set -euo pipefail
          BODY="$(curl -fsS --max-time 12 'https://turftest-api.turftrials.workers.dev/health' || true)"
          echo "$BODY"
          if echo "$BODY" | grep -q '"loginBridge":27' && echo "$BODY" | grep -q '"appProxy":true'; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
            echo 'Existing live Worker already has the exact-app login bridge; no Cloudflare deploy needed.'
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo 'Existing live Worker is not yet the required exact-app bridge.'
          fi

      - name: Deploy Worker V2 only when live Worker is not ready
        if: steps.live_worker.outputs.ready != 'true'
        working-directory: turf-static/worker
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo 'Live Worker is not ready and GitHub Cloudflare secrets are not configured. Leaving turftrials.com unchanged.' >&2
            exit 1
          fi
          npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm exact-app Worker bridge is live
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            BODY="$(curl -fsS --max-time 10 'https://turftest-api.turftrials.workers.dev/health' || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q '"loginBridge":27' && echo "$BODY" | grep -q '"appProxy":true'; then
              exit 0
            fi
            sleep 3
          done
          echo 'Worker loginBridge 27 / appProxy was not confirmed; leaving turftrials.com unchanged.' >&2
          exit 1

      - name: Verify Worker serves the actual current TURF app
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 --max-time 45 \
            'https://turftest-api.turftrials.workers.dev/app?proof=cutover-v27' \
            -o /tmp/turf-worker-app.html
          grep -qi '<html' /tmp/turf-worker-app.html
          grep -q 'id="fhqHome"' /tmp/turf-worker-app.html
          grep -q 'id="turfTopbar"' /tmp/turf-worker-app.html
          grep -q 'id="fhqAlbumPage"' /tmp/turf-worker-app.html
          grep -q 'id="fhqGamesHub"' /tmp/turf-worker-app.html
          grep -q 'TURF_EXACT_BRAND_V8940' /tmp/turf-worker-app.html
          grep -q 'worker-gas-bridge.js?v=worker-auth-27' /tmp/turf-worker-app.html
          grep -q '110-turf-worker-auth-profile-v8968.js?v=worker-auth-27' /tmp/turf-worker-app.html
          if grep -qi 'Sorry, unable to open the file' /tmp/turf-worker-app.html; then
            echo 'Worker proxy received an Apps Script error page; leaving .com unchanged.' >&2
            exit 1
          fi

      - name: Verify root wrapper already points to exact Worker-proxied app
        run: |
          set -euo pipefail
          grep -q "var APP_SRC='https://turftest-api.turftrials.workers.dev/app?production=1&bridge=worker-auth-27';" index.html
          grep -q '/turf-live-worker-parent.js?v=worker-auth-27' index.html
          echo 'Root wrapper is already on Worker auth 27; no visual/app rewrite required.'

# trigger: 2026-08-27 login-only cutover v27; existing TURF remains visual source of truth
