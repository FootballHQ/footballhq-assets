name: Cut Over TURF Login Without Rebuilding UI

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/cutover-turf-login.yml'

permissions:
  contents: write

concurrency:
  group: turf-login-cutover
  cancel-in-progress: false

jobs:
  cutover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact current repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Worker V2
        working-directory: turf-static/worker
        run: |
          npm install --no-audit --no-fund
          npm run check

      - name: Deploy Worker V2
        working-directory: turf-static/worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Confirm exact-app Worker bridge is live
        run: |
          set -euo pipefail
          for i in $(seq 1 24); do
            BODY="$(curl -fsS --max-time 10 'https://turftest-api.turftrials.workers.dev/health' || true)"
            echo "$BODY"
            if echo "$BODY" | grep -q '"loginBridge":16' && echo "$BODY" | grep -q '"appProxy":true'; then
              exit 0
            fi
            sleep 3
          done
          echo 'Worker loginBridge 16 / appProxy was not confirmed; leaving turftrials.com unchanged.' >&2
          exit 1

      - name: Verify Worker serves the actual current TURF app
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 --max-time 45 \
            'https://turftest-api.turftrials.workers.dev/app?proof=cutover-v16' \
            -o /tmp/turf-worker-app.html
          grep -qi '<html' /tmp/turf-worker-app.html
          grep -q 'id="fhqHome"' /tmp/turf-worker-app.html
          grep -q 'id="turfTopbar"' /tmp/turf-worker-app.html
          grep -q 'id="fhqAlbumPage"' /tmp/turf-worker-app.html
          grep -q 'id="fhqGamesHub"' /tmp/turf-worker-app.html
          grep -q 'TURF_EXACT_BRAND_V8940' /tmp/turf-worker-app.html
          grep -q 'worker-gas-bridge.js?v=worker-auth-23' /tmp/turf-worker-app.html
          grep -q '110-turf-worker-auth-profile-v8968.js?v=worker-auth-23' /tmp/turf-worker-app.html
          if grep -qi 'Sorry, unable to open the file' /tmp/turf-worker-app.html; then
            echo 'Worker proxy received an Apps Script error page; leaving .com unchanged.' >&2
            exit 1
          fi

      - name: Point existing TURF wrapper at exact Worker-proxied app
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old=re.search(r"var APP_SRC='[^']+';",s)
          if not old:
              raise SystemExit('APP_SRC not found in root wrapper')
          new="var APP_SRC='https://turftest-api.turftrials.workers.dev/app?build=exact-current-turf-login-only-v16';"
          s=s[:old.start()]+new+s[old.end():]
          p.write_text(s,encoding='utf-8')
          print('Old:',old.group(0))
          print('New:',new)
          PY

      - name: Verify login-only cutover
        run: |
          set -euo pipefail
          grep -q "APP_SRC='https://turftest-api.turftrials.workers.dev/app?build=exact-current-turf-login-only-v16'" index.html
          # Guardrail: this workflow is allowed to change only the iframe source.
          git diff -- index.html

      - name: Commit login-only cutover
        run: |
          set -euo pipefail
          git config user.name 'TURF Login Cutover'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No cutover changes needed.'
            exit 0
          fi
          git commit -m 'Use exact TURF app through Worker login bridge v16 [skip ci]'
          git push

# trigger: 2026-08-26 guarded login-only cutover v16b after worker-auth-23
