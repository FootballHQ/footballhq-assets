name: Deploy TURF Worker V2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'turf-static/worker/**'
      - '.github/workflows/deploy-turf-worker-v2.yml'

permissions:
  contents: read

concurrency:
  group: turf-worker-v2-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: turf-static/worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Worker modules
        run: npm run check

      - name: Deploy migration Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
