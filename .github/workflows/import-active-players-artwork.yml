name: Import Active Players Artwork

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-active-players-artwork.yml'

permissions:
  contents: write

jobs:
  import-artwork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download approved artwork at native resolution
        run: |
          mkdir -p v88-36/art
          curl -L --fail --retry 3 'https://media.canva.com/v2/image-resize/format:JPG/height:941/quality:95/uri:ifs%3A%2F%2FM%2Fce1eb0ab-b214-4167-b0c6-08dfe1828314/watermark:F/width:1672?csig=AAAAAAAAAAAAAAAAAAAAAOMJQB3HMjH_4-B9_tUDep-jsJLha91Baapp3osRH9ae&exp=1787899642&osig=AAAAAAAAAAAAAAAAAAAAAMNLrUfH1OZFP3mooaZwrCMU2UAIYFE6fV7iTZvNmsIl&signer=media-rpc&x-canva-quality=thumbnail' -o v88-36/art/active-players-approved.jpg
          file v88-36/art/active-players-approved.jpg
          python3 - <<'PY'
          from PIL import Image
          im=Image.open('v88-36/art/active-players-approved.jpg')
          print('downloaded dimensions:', im.size)
          if im.width < 1200 or im.height < 650:
              raise SystemExit('Canva returned a thumbnail, not the native artwork')
          PY
      - name: Commit artwork
        run: |
          git config user.name 'TURF Asset Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add v88-36/art/active-players-approved.jpg
          git commit -m 'Install native-resolution Active Players artwork' || exit 0
          git push
