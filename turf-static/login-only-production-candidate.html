<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>TURF Login-Only Candidate</title><style>html,body{margin:0;width:100%;height:100%;background:#07111c;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}.load{position:fixed;inset:0;display:grid;place-items:center;background:#07111c}.card{padding:24px 28px;border:1px solid #28546b;border-radius:18px;background:#0a1c29;text-align:center}.small{margin-top:8px;color:#7899aa;font-size:12px}</style></head><body><div class="load"><div class="card"><strong>Opening existing TURF…</strong><div class="small">Production UI unchanged • Worker login/backend only.</div></div></div><script>(function(){fetch('/index.html?login-only-source=1',{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('Could not load production TURF wrapper: '+r.status);return r.text()}).then(function(html){var workerApp='https://turftest-api.turftrials.workers.dev/app?v=worker15';var next=html.replace(/var APP_SRC='[^']*';/,"var APP_SRC='"+workerApp+"';");if(next===html)throw new Error('Production APP_SRC marker was not found.');next=next.replace(/<title>TURF<\/title>/i,'<title>TURF</title>');document.open();document.write(next);document.close()}).catch(function(e){document.body.innerHTML='<div class="load"><div class="card"><strong>Could not open TURF.</strong><div class="small">'+String(e&&e.message||e)+'</div></div></div>'})})();</script></body></html>
