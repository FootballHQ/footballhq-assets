<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURF</title><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0;min-height:100%;background:#07111c;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}body{display:grid;place-items:center}.card{width:min(430px,calc(100vw - 32px));padding:28px;border:1px solid #23465c;border-radius:22px;background:#0b1b28;text-align:center;box-sizing:border-box}.card h1{margin:0 0 8px;font-size:34px}.card p{color:#a9c7db}.card button{width:100%;min-height:44px;margin-top:10px;border-radius:10px;border:1px solid #2c688d;background:#12344b;color:#fff;font-weight:800}#googleButton{display:flex;justify-content:center;margin:16px 0 8px}#status{min-height:20px;margin-top:12px;font-size:12px;color:#a9c7db}.bad{color:#ff9696!important}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body><div class="card"><h1>TURF</h1><p>Sign in to load your TURF account.</p><div id="googleButton"></div><button id="guest" type="button">Continue as Guest</button><div id="status">Loading sign-in…</div></div><script src="./js/turf-api.js?v=authfirst7"></script><script src="./js/turf-config.js?v=authfirst7"></script><script src="./js/turf-auth.js?v=authfirst7"></script><script>(function(){var status=document.getElementById('status'),guest=document.getElementById('guest'),busy=false;function msg(t,bad){status.textContent=t||'';status.classList.toggle('bad',!!bad)}function enter(p){try{sessionStorage.setItem('turfStaticBootProfileV1',JSON.stringify(p||{}))}catch(e){}location.replace('./app-test-direct.html?v=authfirst7')}function init(){if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(init,100);return}google.accounts.id.initialize({client_id:TURF_STATIC_CONFIG.googleClientId,callback:async function(r){if(busy)return;busy=true;try{msg('Signing in…');var p=await TurfAuth.googleSignIn(r&&r.credential);if(!p)throw new Error('No TURF profile returned');msg('Signed in. Opening TURF…');enter(p)}catch(e){busy=false;msg(e.message||String(e),true)}},auto_select:false,cancel_on_tap_outside:false});google.accounts.id.renderButton(document.getElementById('googleButton'),{theme:'outline',size:'large',text:'signin_with',shape:'rectangular'});msg('Choose Google or Guest.')}guest.onclick=async function(){if(busy)return;busy=true;try{guest.disabled=true;msg('Opening guest account…');var p=await TurfAuth.guestSignIn();if(!p)throw new Error('No guest profile returned');enter(p)}catch(e){busy=false;guest.disabled=false;msg(e.message||String(e),true)}};init()})();</script></body></html>
