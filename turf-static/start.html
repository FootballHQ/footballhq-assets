<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TURF</title><meta name="robots" content="noindex,nofollow"><style>html,body{margin:0;min-height:100%;background:#07111c;color:#eef8ff;font-family:system-ui,-apple-system,sans-serif}body.auth{display:grid;place-items:center}.card{width:min(430px,calc(100vw - 32px));padding:28px;border:1px solid #23465c;border-radius:22px;background:#0b1b28;text-align:center;box-sizing:border-box}.card h1{margin:0 0 8px;font-size:34px}.card p{color:#a9c7db}.card button{width:100%;min-height:44px;margin-top:10px;border-radius:10px;border:1px solid #2c688d;background:#12344b;color:#fff;font-weight:800}#googleButton{display:flex;justify-content:center;margin:16px 0 8px}#status,#health{min-height:20px;margin-top:10px;font-size:12px;color:#a9c7db}.ok{color:#7de0aa!important}.bad{color:#ff9696!important}.ver{margin-top:14px;font-size:10px;color:#527287}.appTop{height:58px;position:fixed;left:282px;right:0;top:0;z-index:20;background:#071824;border-bottom:1px solid #17384a;display:flex;justify-content:flex-end;align-items:center;padding:0 16px;box-sizing:border-box}.wallet{padding:8px 12px;border:1px solid #28506a;border-radius:12px;background:#0a2231;font-weight:800;color:#a9eaff}.side{position:fixed;left:0;top:0;bottom:0;width:282px;background:#0a1118;border-right:1px solid #243b49;padding:18px 14px;box-sizing:border-box}.brand{font-size:30px;font-weight:950;margin:8px 8px 26px}.profile{padding:16px;border:1px solid #2c4656;border-radius:14px;margin-bottom:16px;font-weight:850}.nav button{display:block;width:100%;text-align:left;padding:11px 12px;margin:2px 0;border:0;border-radius:9px;background:transparent;color:#dce8ef;font-weight:800}.main{margin-left:282px;padding:82px 20px 50px}.hero{border:1px solid #1f617d;border-radius:20px;background:linear-gradient(135deg,#0c3450,#071926);padding:30px}.hero h1{font-size:56px;margin:0 0 10px}.hero p{color:#a7bfd0;font-weight:700;max-width:740px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.actions button{padding:13px 18px;border-radius:11px;border:1px solid #2d7ba2;background:#0e4261;color:#fff;font-weight:900}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:18px}.panel{border:1px solid #1f536c;border-radius:18px;background:#092030;padding:18px}.panel h2{margin:0 0 12px}.newgame{min-height:260px;border:1px solid #2d7393;border-radius:16px;background:linear-gradient(145deg,#0d3854,#071a29);padding:22px;display:flex;flex-direction:column;justify-content:flex-end}.newgame h3{font-size:34px;margin:0 0 6px}.challenge{padding:14px;border:1px solid #244c61;border-radius:13px;margin:10px 0;background:#0b2637;display:flex;justify-content:space-between;gap:20px}.muted{color:#7895a8}.badge{position:fixed;right:12px;bottom:12px;z-index:99;padding:7px 10px;border-radius:999px;background:#051019;border:1px solid #3c8bae;color:#a9e6ff;font-size:11px;font-weight:800}@media(max-width:900px){.side{width:220px}.appTop{left:220px}.main{margin-left:220px}.grid{grid-template-columns:1fr}}</style><script src="https://accounts.google.com/gsi/client" async defer></script></head><body class="auth"><div id="authCard" class="card"><h1>TURF</h1><p>Sign in to load your TURF account.</p><div id="health">Checking TURF backend…</div><div id="googleButton"></div><button id="guest" type="button">Continue as Guest</button><div id="status">Loading sign-in…</div><div class="ver">AUTH V10 • same-page app</div></div><div id="appRoot"></div><script src="./js/turf-api.js?v=20260822-1926"></script><script src="./js/turf-config.js?v=20260822-1926"></script><script src="./js/turf-auth.js?v=authv10"></script><script>(function(){var status=document.getElementById('status'),health=document.getElementById('health'),guest=document.getElementById('guest'),busy=false;function set(el,t,cls){el.textContent=t||'';el.className=cls||''}function timeout(p,ms,label){return Promise.race([p,new Promise(function(_,rej){setTimeout(function(){rej(new Error(label||'Request timed out'))},ms)})])}function loadScript(src,id){if(id&&document.getElementById(id))return;var s=document.createElement('script');if(id)s.id=id;s.src=src;s.async=true;s.onerror=function(){console.warn('Could not load',src)};document.body.appendChild(s)}function enter(p){try{sessionStorage.setItem('turfStaticBootProfileV1',JSON.stringify(p||{}))}catch(e){}try{localStorage.setItem('turfAuthCachedProfileV1',JSON.stringify(p||{}))}catch(e){}document.body.className='';document.getElementById('authCard').remove();var r=document.getElementById('appRoot');r.innerHTML='<div class="appTop"><div class="wallet">TURF COINS <span id="coins">0</span></div></div><aside class="side"><div class="brand">TURF</div><div class="profile" id="profile">TURF account</div><div class="nav"><button>⌂ Home</button><button>▣ HQ Pass</button><button>◉ Shop</button><button>▤ Locker</button><button>▦ Collections</button><button>★ Leaderboard</button><button>◈ Games</button><button>⚡ Trials</button><button>▣ Cases</button><button>⌗ Trivia Tac Toe</button><button>● 4 in a Row</button><button>▦ Rankings</button><button>◫ Draft Sim</button></div></aside><main class="main"><section class="hero"><h1>TURF</h1><p>Rankings, daily NFL games, draft simulation, streaks, and one place to compete with friends all season.</p><div class="actions"><button>PLAY DAILY GAMES</button><button>VIEW RANKINGS</button><button>OPEN DRAFT SIM</button></div></section><section class="grid"><div class="panel"><h2>New Game</h2><div class="newgame"><div class="muted">NEW GAME</div><h3>Depth Chart</h3><p class="muted">Order a position room.</p><div class="actions"><button>PLAY NOW →</button></div></div></div><div class="panel"><h2>Featured Challenges</h2><div class="challenge"><span>Complete Today\'s Games</span><strong>0 / 12</strong></div><div class="challenge"><span>Keep Your Streak</span><strong id="streak">0</strong></div><div class="challenge"><span>Lifetime Progress</span><strong id="points">0</strong></div></div></section><section class="panel" style="margin-top:16px"><h2>Daily Rewards</h2><p class="muted">Restoring the preserved TURF runtime now…</p></section></main><div class="badge">APP V10 • SAME PAGE</div>';window.__TURF_AUTH_PROFILE__=p;window.__TURF_AUTH_TOKEN__=p.token||'';window.fhqGetToken=function(){return window.__TURF_AUTH_TOKEN__||''};document.getElementById('profile').textContent=p.username||'TURF account';document.getElementById('coins').textContent=String(p.hqCoins||p.coins||0);document.getElementById('streak').textContent=String(p.streakDays||0);document.getElementById('points').textContent=String(p.points||0);setTimeout(function(){loadScript('./js/static-full-runtime.js?v=10','fullRuntime')},500)}async function checkHealth(){try{var r=await timeout(fetch(TURF_STATIC_CONFIG.apiBaseUrl+'/health',{cache:'no-store'}),8000,'Backend health check timed out');if(!r.ok)throw new Error('Backend returned HTTP '+r.status);await r.json();set(health,'Backend online ✓','ok')}catch(e){set(health,'Backend unavailable: '+(e.message||String(e)),'bad')}}function init(){if(!(window.google&&google.accounts&&google.accounts.id)){setTimeout(init,100);return}google.accounts.id.initialize({client_id:TURF_STATIC_CONFIG.googleClientId,callback:async function(r){if(busy)return;busy=true;try{set(status,'Google verified. Opening TURF…');var p=await timeout(TurfAuth.googleSignIn(r&&r.credential),12000,'TURF backend did not answer the Google sign-in request');if(!p)throw new Error('No TURF profile returned');set(status,'Signed in ✓','ok');setTimeout(function(){enter(p)},100)}catch(e){busy=false;set(status,e.message||String(e),'bad')}},auto_select:false,cancel_on_tap_outside:false});google.accounts.id.renderButton(document.getElementById('googleButton'),{theme:'outline',size:'large',text:'signin_with',shape:'rectangular'});set(status,'Choose Google or Guest.')}guest.onclick=async function(){if(busy)return;busy=true;try{guest.disabled=true;set(status,'Opening guest account…');var p=await timeout(TurfAuth.guestSignIn(),12000,'TURF backend did not answer the Guest request');if(!p)throw new Error('No guest profile returned');enter(p)}catch(e){busy=false;guest.disabled=false;set(status,e.message||String(e),'bad')}};checkHealth();init()})();</script></body></html>
