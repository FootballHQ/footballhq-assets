<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TURF Static Home Test</title>
<meta name="robots" content="noindex,nofollow">
<style>html,body{margin:0;min-height:100%;background:#07111c;color:#eef8ff;font-family:Inter,system-ui,-apple-system,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;color:#9ec7dc;font-weight:800}</style>
</head>
<body>
<div class="boot">Loading TURF static test…</div>
<script>
(function(){
  'use strict';
  /* Google Identity Services is unreliable when the login button lives inside
     our previous nested iframe. Load the same isolated app as the TOP-LEVEL
     document, then append the Home + shell parity layers. */
  fetch('./app-test.html?v=fullshell-top-1',{cache:'no-store'})
    .then(function(r){if(!r.ok)throw new Error('Could not load static TURF test');return r.text()})
    .then(function(html){
      var extra=''+
        '<script src="./js/static-home-parity.js?v=3"><\/script>'+
        '<script src="./js/static-shell-parity.js?v=3"><\/script>'+
        '<div id="staticFullShellBadge" style="position:fixed;right:12px;bottom:12px;z-index:2147483647;padding:7px 10px;border-radius:999px;background:rgba(5,16,25,.92);border:1px solid rgba(97,205,255,.45);color:#a9e6ff;font:700 11px/1 system-ui;pointer-events:none">STATIC HOME FULL SHELL TEST</div>';
      html=html.replace('</body>',extra+'</body>');
      document.open();document.write(html);document.close();
    })
    .catch(function(err){document.body.innerHTML='<div class="boot">'+String(err&&err.message||err)+'</div>'});
})();
</script>
</body>
</html>
